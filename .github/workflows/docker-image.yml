name: Docker image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: llamatale:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - CLI starts
        run: docker run --rm llamatale:ci --help
      - name: Smoke test - web server serves the game page
        run: |
          docker run -d --name llamatale -p 8180:8180 llamatale:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8180/tale/; then
              echo "game page reachable"
              break
            fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8180/tale/
          docker logs llamatale | tail -20
          docker stop llamatale

  publish:
    # Publish to GitHub Container Registry when merging to master.
    # Requires the repo to allow GITHUB_TOKEN package writes
    # (Settings > Actions > General > Workflow permissions > "Read and write permissions"
    #  plus "Allow GitHub Actions to create and approve pull requests" is NOT needed;
    #  packages: write is granted below).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/neph1/llamatale:latest
            ghcr.io/neph1/llamatale:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
